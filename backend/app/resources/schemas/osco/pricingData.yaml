database: osco
collection: pricingData
display_name: Pricing Data
description: >-
  OSCO pricing request/response audit record. One document per order, storing the full payload OSCO sent to the
  pricing service (pricingRequest) alongside the priced result it received back (pricingResponse). The response
  side is authoritative and carries the final money figures - item prices, per-item tax, fees/charges, savings,
  transaction totals, and how the total was split across payment tenders (fundsAllocation). Use this collection
  for order pricing, tax, fee, savings, SNAP/EBT eligibility, and payment-split questions, and to compare what
  was requested against what was priced.
business_context:
  primary_entity: pricing data
  common_user_phrases:
    - pricing for order
    - pricing data for order
    - what was the total for order
    - order total
    - final total for order
    - how much tax was charged
    - tax breakdown for order
    - delivery fee for order
    - fees charged on order
    - minimum order fee
    - what did the customer pay
    - payment split for order
    - how was the order paid
    - tender allocation for order
    - savings on order
    - offers applied to order
    - promo code savings
    - item prices for order
    - price of item on order
    - snap eligible total
    - is the order snap
    - ebt order pricing
    - direct spend allocation
    - banner cash on order
    - write off amount
    - refund amount on order
    - pricing request vs response
    - was this a price check
    - tax area for order
  when_to_use: >-
    Use this collection for order pricing and money questions - final and pre-tax totals, per-item pricing and
    tax, delivery/service fees, savings and offers, SNAP and EBT eligibility totals, funds allocation across
    payment tenders, and payment types used. Also use it to diff the pricing request against the pricing
    response when a total looks wrong. Look records up by orderNumber.
  when_not_to_use: >-
    Do not use for order status, fulfillment, delivery slot, or customer profile questions - those live on the
    osco.order collection, which also holds its own payment status and order line data. This collection is a
    pricing service audit snapshot, so its figures reflect the moment pricing ran and may differ from the
    order's current state. Do not use it for substitution approvals (see osco.sub_future_preference) or for
    the order event timeline (see osco.events).
aliases:
  - pricingData
  - pricing data
  - pricing
  - pricing record
  - pricing request
  - pricing response
  - order pricing
  - order total
  - order totals
  - tax
  - tax breakdown
  - fees
  - charges
  - tender allocation
  - funds allocation
  - payment split
  - savings
identity:
  primary_key: _id
  business_keys:
    - orderNumber
    - pricingResponse.transactionNumber
default_sort:
  field: pricingResponse.transactionTimestamp
  direction: desc
default_limit: 5
fields:
  # ==========================================================================================
  # READ THIS BEFORE QUERYING - this collection has several traps.
  #
  # 1. REQUEST vs RESPONSE. The document mirrors most fields under both pricingRequest (what was
  #    sent) and pricingResponse (what came back). pricingResponse is AUTHORITATIVE for money.
  #    Only use pricingRequest fields when the user explicitly asks what was requested/sent, or
  #    when diffing the two.
  #
  # 2. MONEY IS STORED AS STRINGS. Almost every amount is a decimal string such as "11.95", not a
  #    number. Filter with quoted values. Numeric range operators compare lexicographically and
  #    are UNRELIABLE ("10.00" sorts before "6.99"), so for "orders over $X" style questions,
  #    return the values and compare after retrieval rather than filtering with $gt/$lt.
  #    The one exception is pricingResponse.tax.total, which is a real number.
  #
  # 3. WHICH TOTAL TO USE. In the sample record:
  #      transactionTotal = originalTransactionTotal = "6.38"  (item subtotal before tax and fees)
  #      totalTax = "16.29"                                    (tax PLUS fees - see note 4)
  #      finalTransactionTotal = "22.67"                       (6.38 + 16.29)
  #      fundsAllocation.totalAllocatedAmount = "22.67"        (matches, and the tenders sum to it)
  #    For "what did the customer pay" or "order total", use finalTransactionTotal, NOT
  #    transactionTotal. Cross-check against fundsAllocation.totalAllocatedAmount.
  #
  # 4. totalTax IS NOT PURELY TAX. In the sample, pricingResponse.tax.details lists
  #    "Sales Tax" 0.39, "Delivery Fee" 11.95, and "Minimum Order Fee (under $30)" 3.95, which sum
  #    to the 16.29 reported as totalTax. So fees are folded into the tax total. For actual sales
  #    tax, read the "Sales Tax" entry in pricingResponse.tax.details or sum the per-item
  #    pricingResponse.items.tax.total values. Never report totalTax as the sales tax figure.
  #
  # 5. tax.details HAS TWO INCOMPATIBLE SHAPES. At transaction level
  #    (pricingResponse.tax.details) it is an ARRAY of {key, value} objects. At item and charge
  #    level (pricingResponse.items.tax.details, pricingResponse.charges.tax.details) it is an
  #    OBJECT MAP keyed by tax name, e.g. {"Sales Tax": "0.15"}. Likewise tax.total is a NUMBER at
  #    transaction level but a STRING at item and charge level.
  #
  # 6. storeNumber DIFFERS BETWEEN REQUEST AND RESPONSE IN THE SAME DOCUMENT.
  #    pricingRequest.storeNumber is "177" (unpadded); pricingResponse.storeNumber is "0177"
  #    (zero padded to four). Filter each with its own form, or use $or across both.
  #
  # 7. transactionTimestamp HAS DIFFERENT TYPES. pricingRequest.transactionTimestamp is epoch
  #    milliseconds ($numberLong); pricingResponse.transactionTimestamp is a real BSON date. Use
  #    the response field for all date filtering and sorting.
  #
  # 8. ARRAY ELEMENTS CANNOT BE ISOLATED. $elemMatch is not an allowed operator here, so a filter
  #    on an items.* / charges.* / addresses.* path matches the DOCUMENT if ANY element matches -
  #    it does not tell you which element matched, and two conditions on the same array may be
  #    satisfied by different elements. This matters most for addresses, which contains both a
  #    STORE and a CUSTOMER entry: a filter on addresses.state may match either one. Retrieve and
  #    inspect the elements instead of trying to filter within one.
  #
  # 9. PAYMENT TOKENS ARE SENSITIVE. Every tokenNumber path is a payment token and is neither
  #    filterable nor returnable. Answer payment questions with paymentType / paymentSubType /
  #    amount instead.
  #
  # 10. SPARSE AND TYPE-DRIFTING ITEM FIELDS. Some item fields appear on only some elements (for
  #     example salesUnitNbr), and alcoholVolumePct is a string in the request but a number in the
  #     response. Do not assume a field is present on every item.
  # ==========================================================================================

  # ---------- Document identity ----------
  _id:
    type: objectId
    description: MongoDB internal document id. Use only when the user explicitly provides a Mongo document id/ObjectId.
    synonyms:
      - mongo id
      - document id
      - object id
      - _id
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    examples:
      - 66b56d6953fc255cb8247539
  orderNumber:
    type: string
    description: >-
      Customer order number this pricing record belongs to. This is the top level lookup key for the collection
      and the field to prefer whenever the user names an order. Same identifier as orderNumber on osco.order.
      Stored as a string, so quote the value when filtering.
    synonyms:
      - order number
      - order no
      - order id
      - customer order id
      - transaction number
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
    exact_match: true
    indexed: true
    examples:
      - "70470889"

  # ---------- pricingRequest: identity and context ----------
  pricingRequest.transactionNumber:
    type: string
    description: Transaction number on the pricing request. Mirrors the top level orderNumber; prefer orderNumber for lookups.
    synonyms:
      - request transaction number
      - pricing request transaction number
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    exact_match: true
    examples:
      - "70470889"
  pricingRequest.memberId:
    type: string
    description: >-
      Loyalty member id sent on the pricing request. Sensitive customer identifier - filter by it when the user
      supplies a member id, but do not return it.
    synonyms:
      - member id
      - loyalty id
      - membership id
      - member number
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: true
    sensitive: true
    exact_match: true
  pricingRequest.guid:
    type: string
    description: >-
      Customer guid sent on the pricing request, in the hyphenated form used by customer ids elsewhere in OSCO
      (for example the customerId on osco.ccpa_audit_rits). Sensitive customer identifier - filterable but not
      returned.
    synonyms:
      - guid
      - customer guid
      - customer id
      - customer identifier
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: true
    sensitive: true
    exact_match: true
  pricingRequest.storeNumber:
    type: string
    description: >-
      Store number as sent on the pricing request. NOT zero padded in the sample record ("177"), unlike
      pricingResponse.storeNumber ("0177") in the same document and storeId on osco.store. When filtering by
      store, try the unpadded form here and the padded form on the response, or match both with $or.
    synonyms:
      - request store number
      - store number
      - store
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    exact_match: true
    examples:
      - "177"
  pricingRequest.storeTimeZone:
    type: string
    description: IANA time zone of the store used for pricing. Use this to interpret transaction timestamps in store-local time.
    synonyms:
      - store time zone
      - timezone
      - time zone
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    exact_match: true
    examples:
      - America/Denver
  pricingRequest.terminalNumber:
    type: string
    description: Virtual POS terminal number used for the pricing transaction. Technical value; 99 denotes the online/ecommerce terminal in the sample.
    synonyms:
      - terminal number
      - terminal
      - pos terminal
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    exact_match: true
    examples:
      - "99"
  pricingRequest.cartCategory:
    type: string
    description: >-
      Cart category sent for pricing. 1P denotes a first party cart. Same value domain as
      subOrders.subOrderType.cartCategory on osco.order.
    synonyms:
      - cart category
      - cart type
      - 1p
      - 3p
      - marketplace cart
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    examples:
      - 1P
  pricingRequest.fulfillmentType:
    type: string
    description: >-
      Fulfillment type the order was priced for, such as DELIVERY or DUG. Drives which fees apply, so use it
      when explaining a delivery fee. Only present on the request side.
    synonyms:
      - fulfillment type
      - delivery type
      - delivery or pickup
      - dug
      - delivery
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    examples:
      - DELIVERY
  pricingRequest.banner:
    type: string
    description: >-
      Retail banner used for pricing. Note the mixed case value "Albertsons" here, whereas osco.store stores
      banners uppercase (for example SAFEWAY) - match case insensitively when joining the two.
    synonyms:
      - banner
      - retail banner
      - brand
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    allow_regex: true
    examples:
      - Albertsons
  pricingRequest.transactionTimestamp:
    type: long
    description: >-
      Transaction timestamp on the request, stored as epoch MILLISECONDS ($numberLong), not a date. Date range
      filters written as ISO strings will not match. Use pricingResponse.transactionTimestamp for any date
      filtering or sorting.
    synonyms:
      - request transaction timestamp
      - request timestamp
      - epoch timestamp
    searchable: false
    filterable: true
    sortable: true
    return_by_default: false
    pii: false
    examples:
      - 1723166057146

  # ---------- pricingRequest: SNAP/EBT eligibility and flags ----------
  pricingRequest.isSnap:
    type: boolean
    description: Whether the transaction was submitted as a SNAP (food stamp) transaction. Genuine boolean - filter with true/false unquoted.
    synonyms:
      - is snap
      - snap
      - food stamp
      - snap transaction
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    examples:
      - false
  pricingRequest.isEBTCash:
    type: boolean
    description: Whether the transaction used EBT cash tender. Genuine boolean.
    synonyms:
      - is ebt cash
      - ebt cash
      - ebt
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    examples:
      - false
  pricingRequest.snapEligibleTotal:
    type: string
    description: >-
      Total value of SNAP eligible items sent for pricing, as a decimal string. In the sample this equals the
      item subtotal and the response's transactionTotal ("6.38"). String typed, so avoid numeric range filters.
    synonyms:
      - snap eligible total
      - snap total
      - snap eligible amount
      - food stamp eligible total
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
    examples:
      - "6.38"
  pricingRequest.nonSnapEligibleTotal:
    type: string
    description: >-
      Total value of non SNAP eligible amounts sent for pricing, as a decimal string. In the sample this equals
      the response's totalTax ("16.29"), i.e. the tax and fees portion.
    synonyms:
      - non snap eligible total
      - non snap total
      - ineligible total
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
    examples:
      - "16.29"
  pricingRequest.isAutoReplenishment:
    type: boolean
    description: >-
      Whether the order is an auto-replenishment order. Genuine boolean here, unlike the string "false" carried
      in eventData on osco.events.
    synonyms:
      - auto replenishment
      - auto replenish
      - subscription order
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    examples:
      - false
  pricingRequest.taxType:
    type: string
    description: Tax treatment requested for the transaction. SALE is the observed value.
    synonyms:
      - tax type
      - tax treatment
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    exact_match: true
    examples:
      - SALE
  pricingRequest.enableTax:
    type: boolean
    description: Whether tax calculation was enabled for this pricing call. If false, tax figures on the response will be zero or absent.
    synonyms:
      - enable tax
      - tax enabled
      - was tax calculated
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - true
  pricingRequest.isExceptionEnabled:
    type: boolean
    description: Whether pricing exception handling was enabled for this call. Technical pricing service flag.
    synonyms:
      - is exception enabled
      - exception enabled
      - pricing exception flag
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - true
  pricingRequest.isPriceCheck:
    type: boolean
    description: >-
      Whether this call was a price check (a quote) rather than a real priced transaction. Use this to exclude
      quotes when the user asks about actual order charges - a price check does not represent money taken.
    synonyms:
      - is price check
      - price check
      - quote only
      - was it a quote
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    examples:
      - false

  # ---------- pricingRequest: items (core comparison fields only) ----------
  # Full per-item detail is declared on the response side, which mirrors these keys. Use the request
  # item fields only to diff what was sent against what was priced.
  pricingRequest.items.itemCode:
    type: string
    description: Item code (UPC form) of an item sent for pricing. Use the response side for priced item questions; use this only when diffing request against response.
    synonyms:
      - request item code
      - requested item code
      - requested upc
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    exact_match: true
    allow_regex: true
    examples:
      - "0002113007010"
  pricingRequest.items.entryId:
    type: integer
    description: Entry id of an item line on the request. Integer, unlike the string entry ids seen elsewhere in OSCO.
    synonyms:
      - request entry id
      - requested entry id
    searchable: false
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - 5001
  pricingRequest.items.qty:
    type: integer
    description: Quantity of an item as sent for pricing. Genuine integer here, unlike the string quantities on osco.sub_future_preference.
    synonyms:
      - request quantity
      - requested qty
      - requested quantity
    searchable: false
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - 1
  pricingRequest.items.unitPrice:
    type: string
    description: Unit price of an item as sent for pricing, as a decimal string. Compare against the response unit price to detect repricing.
    synonyms:
      - request unit price
      - requested unit price
      - submitted price
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - "2.39"
  pricingRequest.items.netItemPrice:
    type: string
    description: Net item price as sent for pricing, as a decimal string.
    synonyms:
      - request net item price
      - requested net price
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - "2.39"
  pricingRequest.items.description:
    type: string
    description: Item description as sent for pricing. Prefer the response side for item name searches.
    synonyms:
      - request item description
      - requested item name
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    allow_regex: true
  pricingRequest.items.isSnapEligible:
    type: boolean
    description: Whether an item was flagged SNAP eligible on the request. Genuine boolean.
    synonyms:
      - request snap eligible
      - requested snap eligible
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - true
  pricingRequest.items.substituted:
    type: boolean
    description: Whether an item was marked as substituted on the request. For substitution detail use the osco.sub_future_preference collection.
    synonyms:
      - request substituted
      - was it substituted
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - false
  pricingRequest.items.originalEntryId:
    type: integer
    description: Original entry id the request item maps back to on the customer's cart.
    synonyms:
      - request original entry id
      - original entry id
    searchable: false
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - 1

  # ---------- pricingRequest: transaction level savings and offers ----------
  pricingRequest.txnLevelSavings.offerId:
    type: string
    description: >-
      Internal offer id applied at transaction level. Use this for "which offers were applied to the order"
      questions. Note the offers live on the request side; the response reports the resulting totalSavings.
    synonyms:
      - offer id
      - offer
      - promotion id
      - deal id
      - transaction level offer
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    examples:
      - "90120515"
  pricingRequest.txnLevelSavings.externalOfferId:
    type: string
    description: External/partner offer id for a transaction level offer, typically the internal offer id with a suffix such as -ND.
    synonyms:
      - external offer id
      - partner offer id
      - external promotion id
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    allow_regex: true
    examples:
      - 90120515-ND
  pricingRequest.txnLevelSavings.discountQty:
    type: integer
    description: Number of units the transaction level offer discounts.
    synonyms:
      - discount quantity
      - discount qty
      - offer quantity
    searchable: false
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - 1
  pricingRequest.txnLevelSavings.calculateUsage:
    type: boolean
    description: Whether offer usage should be counted against the customer's limit for this transaction level offer.
    synonyms:
      - calculate usage
      - count usage
      - offer usage flag
    searchable: false
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - false
  pricingRequest.txnLevelSavings.clipIds:
    type: string
    description: >-
      Clip ids tying the offer to the customer's clipped coupons. An array of strings that may be empty, and
      may contain the sentinel value "No Limit" instead of a real id, so do not treat entries as identifiers
      without checking.
    synonyms:
      - clip ids
      - clip id
      - coupon clip
      - clipped coupon
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    exact_match: true
    examples:
      - No Limit
  pricingRequest.promoCodeSavings:
    type: array
    description: >-
      Promo code savings applied to the transaction. Empty in the sample record, so its element structure is
      unknown - check for a non-empty array before reporting promo code savings, and do not assume field names
      inside it.
    synonyms:
      - promo code savings
      - promo code
      - promotion code
      - coupon code
      - discount code
    searchable: false
    filterable: false
    sortable: false
    return_by_default: false
    pii: false

  # ---------- pricingRequest: charges and tender as submitted ----------
  pricingRequest.charges.displayName:
    type: string
    description: Display name of a fee/charge as submitted for pricing. Use the response side for the charged amounts.
    synonyms:
      - request charge name
      - submitted fee name
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    allow_regex: true
  pricingRequest.charges.category:
    type: string
    description: Category of a fee/charge as submitted, such as shipping or service.
    synonyms:
      - request charge category
      - submitted fee category
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    exact_match: true
  pricingRequest.charges.salesPrice:
    type: string
    description: Sales price of a fee/charge as submitted, as a decimal string. Compare with the response salesPrice to spot fee changes during pricing.
    synonyms:
      - request charge amount
      - submitted fee amount
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
  pricingRequest.tenderAllocationSummary.tokenNumber:
    type: string
    description: Payment token on the requested tender allocation. Sensitive payment token; never return or filter by it.
    synonyms:
      - request tender token
      - payment token
    searchable: false
    filterable: false
    sortable: false
    return_by_default: false
    pii: true
    sensitive: true
  pricingRequest.tenderAllocationSummary.paymentType:
    type: string
    description: Payment type on the requested tender allocation, such as CREDITCARD or DIRECTSPEND.
    synonyms:
      - request payment type
      - submitted payment type
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    exact_match: true
  pricingRequest.tenderAllocationSummary.paymentSubType:
    type: string
    description: Payment sub type on the requested tender allocation, such as VISA or SODA_HEALTH.
    synonyms:
      - request payment sub type
      - submitted card type
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    exact_match: true
  pricingRequest.tenderAllocationSummary.amount:
    type: string
    description: >-
      Amount allocated to a tender on the request, as a decimal string. Note the request and response can
      differ in formatting for the same tender ("15.9" on the request vs "15.90" on the response), so compare
      them numerically after retrieval, not as strings.
    synonyms:
      - request tender amount
      - submitted tender amount
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - "15.9"

  # ---------- pricingResponse: identity and context (authoritative side) ----------
  pricingResponse.transactionNumber:
    type: string
    description: Transaction number on the pricing response. Mirrors the top level orderNumber; prefer orderNumber for lookups.
    synonyms:
      - response transaction number
      - pricing response transaction number
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    exact_match: true
    examples:
      - "70470889"
  pricingResponse.memberId:
    type: string
    description: Loyalty member id echoed on the pricing response. Sensitive customer identifier - filterable but not returned.
    synonyms:
