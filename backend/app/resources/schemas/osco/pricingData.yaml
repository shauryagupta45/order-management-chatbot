    description: >-
      Alcohol by volume percentage for the item; 0 for non-alcoholic items. Numeric on the response side but a
      STRING ("0") on the request side, so filter unquoted here and quoted there.
    synonyms:
      - alcohol volume pct
      - alcohol percentage
      - abv
      - alcohol content
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - 0
  pricingResponse.items.salesUnitNbr:
    type: integer
    description: >-
      Sales unit number for the item. SPARSE - present on some item elements and absent on others in the sample
      record, so a filter on it will silently exclude items where it is missing.
    synonyms:
      - sales unit number
      - sales unit nbr
      - sales unit
    searchable: false
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - 0
  pricingResponse.items.itemPluNumber:
    type: string
    description: PLU (price look-up) number for the item, as a string. "0" when the item has no PLU.
    synonyms:
      - plu
      - plu number
      - item plu number
      - price look up code
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    exact_match: true
    examples:
      - "0"
  pricingResponse.items.tenderAllocations.tokenNumber:
    type: string
    description: Payment token the item's cost was allocated to. Sensitive payment token; never return or filter by it. Use paymentSubType to identify the tender instead.
    synonyms:
      - item tender token
      - payment token
    searchable: false
    filterable: false
    sortable: false
    return_by_default: false
    pii: true
    sensitive: true
  pricingResponse.items.tenderAllocations.paymentSubType:
    type: string
    description: >-
      Payment sub type the item's cost was allocated to, such as VISA or SODA_HEALTH. Use this to answer which
      tender paid for a given item. Note there is no paymentType at item level, only at
      fundsAllocation.tenderAllocationSummary.
    synonyms:
      - item payment sub type
      - item tender type
      - which card paid for the item
      - item payment method
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    examples:
      - SODA_HEALTH
  pricingResponse.items.tenderAllocations.amount:
    type: string
    description: >-
      Amount of the item's cost allocated to a tender, as a decimal string. Note this can exceed the item's
      netItemPrice because tax is allocated alongside the item ("2.54" allocated for a "2.39" item).
    synonyms:
      - item tender amount
      - item allocated amount
      - amount allocated to item
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    examples:
      - "2.54"

  # ---------- pricingResponse: fees and charges ----------
  pricingResponse.charges.displayName:
    type: string
    description: >-
      Customer facing name of a fee/charge, such as "DeliveryFee" or "Minimum order fee (under $30)". Prefer
      this field for fee questions; supports regex/partial matching since users type fee names loosely (note
      "DeliveryFee" has no space).
    synonyms:
      - charge name
      - fee name
      - delivery fee
      - service fee
      - minimum order fee
      - fee
      - charge
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    allow_regex: true
    examples:
      - DeliveryFee
      - Minimum order fee (under $30)
  pricingResponse.charges.description:
    type: string
    description: Description of the fee/charge. Duplicates displayName in the sample record.
    synonyms:
      - charge description
      - fee description
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    allow_regex: true
  pricingResponse.charges.category:
    type: string
    description: >-
      Category of the fee/charge. Observed values are "shipping" for delivery fees and "service" for service
      fees - note these are lowercase, unlike most codes in OSCO.
    synonyms:
      - charge category
      - fee category
      - fee type
      - shipping
      - service fee category
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    examples:
      - shipping
      - service
  pricingResponse.charges.upc:
    type: string
    description: Internal UPC used to represent the fee as a sellable line. Zero padded 13 characters.
    synonyms:
      - charge upc
      - fee upc
      - fee item code
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    exact_match: true
    examples:
      - "0000000022119"
  pricingResponse.charges.salesPrice:
    type: string
    description: Amount actually charged for the fee, as a decimal string. Use this for "how much was the delivery fee" questions.
    synonyms:
      - charge amount
      - fee amount
      - how much was the fee
      - sales price
      - fee charged
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    examples:
      - "11.95"
  pricingResponse.charges.originalPrice:
    type: string
    description: Original amount of the fee before any waiver or adjustment, as a decimal string. A difference from salesPrice indicates the fee was adjusted.
    synonyms:
      - charge original price
      - original fee amount
      - fee before discount
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    examples:
      - "11.95"
  pricingResponse.charges.tax.total:
    type: string
    description: >-
      Tax charged on the fee, as a decimal STRING. "0.00" in the sample, meaning the fees were not themselves
      taxed - even though the fee amounts are folded into the transaction level totalTax.
    synonyms:
      - charge tax
      - fee tax
      - tax on fee
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - "0.00"
  pricingResponse.charges.tax.details:
    type: object
    description: >-
      Fee level tax breakdown as an OBJECT MAP keyed by tax name, for example {"Sales Tax": "0.00"} - the same
      shape as item level tax details, and different from the transaction level array form. Dynamic keys, so
      return the whole map and read it.
    synonyms:
      - charge tax details
      - fee tax breakdown
    searchable: false
    filterable: false
    sortable: false
    return_by_default: false
    pii: false
  pricingResponse.charges.tenderAllocations.tokenNumber:
    type: string
    description: Payment token the fee was allocated to. Sensitive payment token; never return or filter by it.
    synonyms:
      - charge tender token
      - fee payment token
    searchable: false
    filterable: false
    sortable: false
    return_by_default: false
    pii: true
    sensitive: true
  pricingResponse.charges.tenderAllocations.paymentSubType:
    type: string
    description: Payment sub type the fee was charged to, such as VISA. Use this to answer which tender paid the fees - in the sample, fees went to the credit card rather than the Direct Spend tender.
    synonyms:
      - charge payment sub type
      - fee payment method
      - which card paid the fee
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    examples:
      - VISA
  pricingResponse.charges.tenderAllocations.amount:
    type: string
    description: Amount of the fee allocated to a tender, as a decimal string.
    synonyms:
      - charge tender amount
      - fee allocated amount
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    examples:
      - "11.95"

  # ---------- pricingResponse: funds allocation across tenders ----------
  pricingResponse.fundsAllocation.totalAllocatedAmount:
    type: string
    description: >-
      Total amount allocated across all payment tenders, as a decimal string. Should equal
      finalTransactionTotal - it does in the sample ("22.67") - so use it as a cross-check when a total looks
      wrong.
    synonyms:
      - total allocated amount
      - total allocated
      - amount allocated
      - total funds allocated
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
    examples:
      - "22.67"
  pricingResponse.fundsAllocation.unallocatedAmount:
    type: string
    description: >-
      Amount of the total not covered by any tender, as a decimal string. Should be "0.00"; a non-zero value
      means the order is underfunded, so this is a useful field for payment problem questions.
    synonyms:
      - unallocated amount
      - unallocated
      - unfunded amount
      - amount not covered
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
    examples:
      - "0.00"
  pricingResponse.fundsAllocation.totalSnapAmount:
    type: string
    description: Total amount paid with SNAP/EBT funds, as a decimal string.
    synonyms:
      - total snap amount
      - snap amount
      - ebt amount
      - snap paid
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
    examples:
      - "0.00"
  pricingResponse.fundsAllocation.totalWriteOffAmount:
    type: string
    description: Total amount written off across the transaction, as a decimal string. Non-zero values indicate absorbed cost.
    synonyms:
      - total write off amount
      - write off total
      - total writeoff
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
    examples:
      - "0.00"
  pricingResponse.fundsAllocation.totalRefundAmount:
    type: string
    description: Total amount refunded on the transaction, as a decimal string. Use this for refund questions, but confirm against the order's own payment records on osco.order.
    synonyms:
      - total refund amount
      - refund amount
      - refunded
      - total refunded
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
    examples:
      - "0.00"
  pricingResponse.fundsAllocation.data.totalBannerCashAmount:
    type: string
    description: Total banner cash (store credit) applied to the transaction, as a decimal string.
    synonyms:
      - banner cash amount
      - total banner cash
      - store credit
      - banner cash
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - "0.00"
  pricingResponse.fundsAllocation.data.totalBannerCashDeltaAmount:
    type: string
    description: Change in banner cash applied relative to the previous allocation, as a decimal string.
    synonyms:
      - banner cash delta
      - banner cash change
    searchable: false
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - "0.00"
  pricingResponse.fundsAllocation.data.totalBannerCashRefundAmount:
    type: string
    description: Banner cash refunded on the transaction, as a decimal string.
    synonyms:
      - banner cash refund
      - store credit refund
    searchable: false
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - "0.00"
  pricingResponse.fundsAllocation.data.totalAchAmount:
    type: string
    description: >-
      Total paid by ACH/bank transfer, as a decimal string. Note the sample value is "0" rather than the "0.00"
      used by the sibling amount fields, so match both forms when filtering for zero.
    synonyms:
      - ach amount
      - total ach
      - bank transfer amount
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    examples:
      - "0"
  pricingResponse.fundsAllocation.tenderAllocationSummary.tokenNumber:
    type: string
    description: Payment token for a tender in the allocation summary. Sensitive payment token; never return or filter by it. Identify tenders by paymentType/paymentSubType instead.
    synonyms:
      - tender token
      - allocation token
      - payment token
      - card number
    searchable: false
    filterable: false
    sortable: false
    return_by_default: false
    pii: true
    sensitive: true
  pricingResponse.fundsAllocation.tenderAllocationSummary.paymentType:
    type: string
    description: >-
      Payment type for a tender in the allocation summary. Observed values are CREDITCARD and DIRECTSPEND. Use
      this to answer how the order was paid and to detect split-tender orders (more than one entry in the
      summary).
    synonyms:
      - payment type
      - tender type
      - payment method
      - how was it paid
      - paid with
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    examples:
      - CREDITCARD
      - DIRECTSPEND
  pricingResponse.fundsAllocation.tenderAllocationSummary.paymentSubType:
    type: string
    description: >-
      Payment sub type for a tender in the allocation summary, such as VISA for a credit card or SODA_HEALTH for
      a Direct Spend benefit program. Use this for card brand and benefit program questions.
    synonyms:
      - payment sub type
      - card type
      - card brand
      - tender sub type
      - visa
      - soda health
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    examples:
      - VISA
      - SODA_HEALTH
  pricingResponse.fundsAllocation.tenderAllocationSummary.amount:
    type: string
    description: >-
      Amount allocated to a tender, as a decimal string. The entries should sum to totalAllocatedAmount
      ("15.90" + "6.77" = "22.67" in the sample). Because array elements cannot be isolated, retrieve the
      paymentType, paymentSubType and amount together and pair them after retrieval.
    synonyms:
      - tender amount
      - allocated amount
      - amount per tender
      - how much on each card
      - payment split amount
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    examples:
      - "15.90"
      - "6.77"

  # ---------- pricingResponse: addresses (STORE and CUSTOMER entries in one array) ----------
  # The request side mirrors these fields; only the response side is declared to limit the PII surface.
  # Note zipCodeExtn differs between request and response for the same address in the sample record, so
  # treat the extension as unreliable.
  pricingResponse.addresses.addressType:
    type: string
    description: >-
      Type of an address entry - STORE for the fulfilling store, CUSTOMER for the delivery address. Since array
      elements cannot be isolated, a filter on another addresses.* field may match either entry; return
      addressType alongside any address field so the entries can be told apart.
    synonyms:
      - address type
      - store or customer address
      - which address
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    examples:
      - STORE
      - CUSTOMER
  pricingResponse.addresses.storeId:
    type: string
    description: >-
      Store id on the STORE address entry, zero padded to four characters. Absent on the CUSTOMER entry. Matches
      storeId on osco.store.
    synonyms:
      - store id
      - address store id
      - store number on address
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    examples:
      - "0177"
  pricingResponse.addresses.streetAddress1:
    type: string
    description: Street address line of an address entry. Address data - do not return or filter by default; for the CUSTOMER entry this is customer PII.
    synonyms:
      - street address
      - address line 1
      - address
    searchable: false
    filterable: false
    sortable: false
    return_by_default: false
    pii: true
    sensitive: true
  pricingResponse.addresses.city:
    type: string
    description: City of an address entry. Address data - do not return by default. A filter here may match either the store or the customer entry.
    synonyms:
      - city
      - address city
    searchable: false
    filterable: false
    sortable: false
    return_by_default: false
    pii: true
  pricingResponse.addresses.state:
    type: string
    description: State of an address entry. Address data - do not return by default. A filter here may match either the store or the customer entry.
    synonyms:
      - state
      - address state
    searchable: false
    filterable: false
    sortable: false
    return_by_default: false
    pii: true
  pricingResponse.addresses.zipCode:
    type: string
    description: >-
      ZIP code of an address entry. Address data - do not return or filter by default. Relevant to tax
      jurisdiction, but use pricingResponse.taxAreaId for tax questions instead.
    synonyms:
      - zip
      - zip code
      - postal code
    searchable: false
    filterable: false
    sortable: false
    return_by_default: false
    pii: true
    sensitive: true
  pricingResponse.addresses.zipCodeExtn:
    type: string
    description: >-
      ZIP+4 extension of an address entry. Unreliable - the request and response carry different extensions for
      the same address in the sample record, and the value may be an empty string. Do not use it to identify a
      location.
    synonyms:
      - zip extension
      - zip plus 4
      - zip code extension
    searchable: false
    filterable: false
    sortable: false
    return_by_default: false
    pii: true
  pricingResponse.addresses.country:
    type: string
    description: Country code of an address entry. USA in the sample. Not customer identifying on its own.
    synonyms:
      - country
      - country code
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    exact_match: true
    examples:
      - USA

  # ---------- Technical persistence metadata ----------
  _class:
    type: string
    description: Java class used by Spring Data to persist the document. Technical metadata only - not useful for business questions and should not be returned unless explicitly requested.
    synonyms:
      - class
      - java class
      - document class
      - _class
    searchable: false
    filterable: true
    sortable: false
    return_by_default: false
    pii: false
    exact_match: true
    examples:
      - com.albertsons.ecommerce.osco.pricing.model.PricingData

sample_queries:
  - user_request: show pricing data for order 70470889
    target:
      database: osco
      collection: pricingData
      filter:
        orderNumber: "70470889"
  - user_request: what was the total for order 70470889
    target:
      database: osco
      collection: pricingData
      filter:
        orderNumber: "70470889"
      fields:
        - orderNumber
        - pricingResponse.finalTransactionTotal
        - pricingResponse.transactionTotal
        - pricingResponse.totalTax
        - pricingResponse.totalSavings
  - user_request: how much tax was charged on order 70470889
    target:
      database: osco
      collection: pricingData
      filter:
        orderNumber: "70470889"
      fields:
        - orderNumber
        - pricingResponse.totalTax
        - pricingResponse.tax.total
        - pricingResponse.tax.details.key
        - pricingResponse.tax.details.value
        - pricingResponse.taxAreaId
  - user_request: give me the tax breakdown for order 70470889
    target:
      database: osco
      collection: pricingData
      filter:
        orderNumber: "70470889"
      fields:
        - orderNumber
        - pricingResponse.tax.details.key
        - pricingResponse.tax.details.value
        - pricingResponse.items.itemCode
        - pricingResponse.items.description
        - pricingResponse.items.tax.total
  - user_request: what fees were charged on order 70470889
    target:
      database: osco
      collection: pricingData
      filter:
        orderNumber: "70470889"
      fields:
        - orderNumber
        - pricingResponse.charges.displayName
        - pricingResponse.charges.category
        - pricingResponse.charges.originalPrice
        - pricingResponse.charges.salesPrice
  - user_request: what was the delivery fee on order 70470889
    target:
      database: osco
      collection: pricingData
      filter:
        orderNumber: "70470889"
      fields:
        - orderNumber
        - pricingResponse.charges.displayName
        - pricingResponse.charges.salesPrice
        - pricingRequest.fulfillmentType
  - user_request: show orders that were charged a minimum order fee
    target:
      database: osco
      collection: pricingData
      filter:
        pricingResponse.charges.displayName:
          $regex: minimum order fee
          $options: i
      fields:
        - orderNumber
        - pricingResponse.charges.displayName
        - pricingResponse.charges.salesPrice
  - user_request: how was order 70470889 paid
    target:
      database: osco
      collection: pricingData
      filter:
        orderNumber: "70470889"
      fields:
        - orderNumber
        - pricingResponse.finalTransactionTotal
        - pricingResponse.fundsAllocation.totalAllocatedAmount
        - pricingResponse.fundsAllocation.tenderAllocationSummary.paymentType
        - pricingResponse.fundsAllocation.tenderAllocationSummary.paymentSubType
        - pricingResponse.fundsAllocation.tenderAllocationSummary.amount
  - user_request: show orders paid with direct spend
    target:
      database: osco
      collection: pricingData
      filter:
        pricingResponse.fundsAllocation.tenderAllocationSummary.paymentType: DIRECTSPEND
      fields:
        - orderNumber
        - pricingResponse.fundsAllocation.tenderAllocationSummary.paymentType
        - pricingResponse.fundsAllocation.tenderAllocationSummary.paymentSubType
        - pricingResponse.fundsAllocation.tenderAllocationSummary.amount
  - user_request: show orders paid with SODA_HEALTH
    target:
      database: osco
      collection: pricingData
      filter:
        pricingResponse.fundsAllocation.tenderAllocationSummary.paymentSubType: SODA_HEALTH
  - user_request: find orders with unallocated funds
    target:
      database: osco
      collection: pricingData
      filter:
        pricingResponse.fundsAllocation.unallocatedAmount:
          $ne: "0.00"
      fields:
        - orderNumber
        - pricingResponse.finalTransactionTotal
        - pricingResponse.fundsAllocation.totalAllocatedAmount
        - pricingResponse.fundsAllocation.unallocatedAmount
  - user_request: show item prices for order 70470889
    target:
      database: osco
      collection: pricingData
      filter:
        orderNumber: "70470889"
      fields:
        - orderNumber
        - pricingResponse.items.itemCode
        - pricingResponse.items.description
        - pricingResponse.items.qty
        - pricingResponse.items.unitPrice
        - pricingResponse.items.netItemPrice
        - pricingResponse.items.extendedPrice
        - pricingResponse.items.tax.total
  - user_request: which orders included item 0002113007010
    target:
      database: osco
      collection: pricingData
      filter:
        pricingResponse.items.itemCode: "0002113007010"
      fields:
        - orderNumber
        - pricingResponse.items.itemCode
        - pricingResponse.items.description
        - pricingResponse.items.unitPrice
  - user_request: show pricing for orders containing milk
    target:
      database: osco
      collection: pricingData
      filter:
        pricingResponse.items.description:
          $regex: milk
          $options: i
      fields:
        - orderNumber
        - pricingResponse.items.description
        - pricingResponse.items.unitPrice
  - user_request: show snap eligible totals for order 70470889
    target:
      database: osco
      collection: pricingData
      filter:
        orderNumber: "70470889"
      fields:
        - orderNumber
        - pricingRequest.isSnap
        - pricingRequest.snapEligibleTotal
        - pricingRequest.nonSnapEligibleTotal
        - pricingResponse.fundsAllocation.totalSnapAmount
  - user_request: show snap transactions
    target:
      database: osco
      collection: pricingData
      filter:
        pricingResponse.isSnap: true
  - user_request: which offers were applied to order 70470889
    target:
      database: osco
      collection: pricingData
      filter:
        orderNumber: "70470889"
      fields:
        - orderNumber
        - pricingRequest.txnLevelSavings.offerId
        - pricingRequest.txnLevelSavings.externalOfferId
        - pricingResponse.totalSavings
        - pricingResponse.totalCardSavings
  - user_request: find orders that used offer 90120515
    target:
      database: osco
      collection: pricingData
      filter:
        pricingRequest.txnLevelSavings.offerId: "90120515"
  - user_request: show pricing for store 0177
    target:
      database: osco
      collection: pricingData
      filter:
        pricingResponse.storeNumber: "0177"
      fields:
        - orderNumber
        - pricingResponse.storeNumber
        - pricingResponse.finalTransactionTotal
        - pricingResponse.transactionTimestamp
  - user_request: show pricing records priced on 2024-08-09
    target:
      database: osco
      collection: pricingData
      filter:
        pricingResponse.transactionTimestamp:
          $gte: "2024-08-09T00:00:00.000Z"
          $lt: "2024-08-10T00:00:00.000Z"
      fields:
        - orderNumber
        - pricingResponse.transactionTimestamp
        - pricingResponse.finalTransactionTotal
  - user_request: show the most recent pricing records
    target:
      database: osco
      collection: pricingData
      filter: {}
      sort:
        pricingResponse.transactionTimestamp: -1
  - user_request: exclude price checks and show real priced orders
    target:
      database: osco
      collection: pricingData
      filter:
        pricingRequest.isPriceCheck: false
      fields:
        - orderNumber
        - pricingRequest.isPriceCheck
        - pricingResponse.finalTransactionTotal
  - user_request: compare the requested and priced unit prices for order 70470889
    target:
      database: osco
      collection: pricingData
      filter:
        orderNumber: "70470889"
