  # ---------- pricingResponse: transaction totals. READ NOTES 2, 3 AND 4 ABOVE. ----------
  pricingResponse.finalTransactionTotal:
    type: string
    description: >-
      FINAL amount for the transaction - item subtotal plus tax and fees. This is the figure to use for "order
      total" and "what did the customer pay". In the sample it equals originalTransactionTotal + totalTax
      ("6.38" + "16.29" = "22.67") and matches fundsAllocation.totalAllocatedAmount. Decimal string, so avoid
      numeric range filters.
    synonyms:
      - final transaction total
      - final total
      - order total
      - grand total
      - total charged
      - amount paid
      - what did the customer pay
      - total amount
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
    examples:
      - "22.67"
  pricingResponse.transactionTotal:
    type: string
    description: >-
      Item subtotal before tax and fees, as a decimal string. Despite the name this is NOT the amount charged -
      use finalTransactionTotal for that. In the sample it equals the sum of item prices and
      pricingRequest.snapEligibleTotal ("6.38").
    synonyms:
      - transaction total
      - subtotal
      - item subtotal
      - pre tax total
      - merchandise total
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
    examples:
      - "6.38"
  pricingResponse.originalTransactionTotal:
    type: string
    description: >-
      Item subtotal as originally priced, before any repricing. Equal to transactionTotal in the sample; a
      difference between the two indicates the transaction was repriced.
    synonyms:
      - original transaction total
      - original total
      - original subtotal
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
    examples:
      - "6.38"
  pricingResponse.totalTax:
    type: string
    description: >-
      Total reported as tax, as a decimal string - but in the sample it also INCLUDES FEES. Its 16.29 is the sum
      of the tax.details entries "Sales Tax" 0.39, "Delivery Fee" 11.95 and "Minimum Order Fee (under $30)"
      3.95. Do not report this as the sales tax amount; for real sales tax use the "Sales Tax" entry in
      pricingResponse.tax.details or sum pricingResponse.items.tax.total.
    synonyms:
      - total tax
      - tax total
      - tax amount
      - how much tax
      - tax charged
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
    examples:
      - "16.29"
  pricingResponse.totalSavings:
    type: string
    description: Total savings applied to the transaction, as a decimal string. "0.00" means no savings were applied even if offers appear under pricingRequest.txnLevelSavings.
    synonyms:
      - total savings
      - savings
      - total discount
      - how much did they save
      - discount total
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
    examples:
      - "0.00"
  pricingResponse.totalCardSavings:
    type: string
    description: Total savings attributable to the loyalty card, as a decimal string. A subset of totalSavings.
    synonyms:
      - total card savings
      - card savings
      - loyalty savings
      - club card savings
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
    examples:
      - "0.00"

  # ---------- pricingResponse: transaction level tax breakdown ----------
  # NOTE: at this level tax.total is a NUMBER and tax.details is an ARRAY of {key, value}.
  # At item and charge level tax.total is a STRING and tax.details is an OBJECT MAP. See note 5.
  pricingResponse.tax.total:
    type: decimal
    description: >-
      Transaction level tax total. The one genuinely numeric money field on this collection - filter it with an
      unquoted number, unlike the string totals elsewhere. Carries the same value as the string field totalTax
      and, like it, includes fees in the sample record.
    synonyms:
      - tax total
      - total tax amount
      - tax
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
    examples:
      - 16.29
  pricingResponse.tax.details.key:
    type: string
    description: >-
      Name of a line in the transaction level tax breakdown, such as "Sales Tax", "Delivery Fee" or "Minimum
      Order Fee (under $30)". Use this to separate genuine tax from fees inside totalTax. Because array
      elements cannot be isolated, retrieve both key and value and pair them after retrieval.
    synonyms:
      - tax detail key
      - tax line name
      - tax breakdown name
      - fee name
      - charge name
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    allow_regex: true
    examples:
      - Sales Tax
      - Delivery Fee
  pricingResponse.tax.details.value:
    type: string
    description: Amount for a line in the transaction level tax breakdown, as a decimal string. Pair with the corresponding key after retrieval.
    synonyms:
      - tax detail value
      - tax line amount
      - tax breakdown amount
      - fee amount
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    examples:
      - "0.39"
      - "11.95"

