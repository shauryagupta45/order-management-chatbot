database: osco
collection: order
display_name: Order
description: Primary OSCO order document. Use this collection for order header, customer, status, fulfillment, payment status, sub-order, delivery slot, tote, exception, and order-line questions.
business_context:
  primary_entity: order
  common_user_phrases:
    - find order by order number
    - get order details
    - lookup osco order
    - search order id
    - find customer order
    - show order status
    - show sub order details
    - show order lines
    - show delivery slot
  when_to_use: Use this collection for OSCO order-level records, including order status, store, fulfillment system, customer id, order totals, payment status, sub-orders, delivery details, tote details, exceptions, and item lines.
  when_not_to_use: >-
    Do not use for order summary-only reporting if the user explicitly asks for orderSummary. In prod, orders are
    moved from this collection to osco.orderHistory in batches (about 6 months kept as of 2026-10-30), so do not use
    it for dates before the handoff (the newest orderCreatedDate in osco.orderHistory) such as "same date last year",
    last year's holidays, or year-over-year comparisons - query osco.orderHistory only for those. For a range that
    crosses the handoff, use count_orders, which splits the range between both collections.
aliases:
  - order
  - customer order
  - order document
  - order record
identity:
  primary_key: _id
  business_keys:
    - orderNumber
    - posTransactionNumber
    - customer.customerId
    - subOrders.fulfillmentOrderNumber
default_limit: 10
fields:
  # Mongo document identity. Use only when the user gives a Mongo/ObjectId value.
  _id:
    type: objectId
    description: MongoDB internal document id. Use only when the user explicitly provides a Mongo document id/ObjectId.
    synonyms:
      - mongo id
      - document id
      - object id
      - _id
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true

  # Intentionally ignored infrastructure fields:
  # - version: audit/storage version, not the business order version. Prefer versionNumber.
  # - createdBy, modifiedBy: technical audit fields. createdDate/modifiedDate are declared below for date filters only;
  #   prefer orderCreatedDate for order creation.
  # - ttl: retention/storage control, not useful for order questions.

  # Primary business identifiers. Prefer orderNumber when the user says order id/order number.
  orderNumber:
    type: string
    description: Primary customer/order business identifier. Prefer this field when the user says order number, order id, customer order id, or asks to find an order.
    synonyms:
      - order number
      - order no
      - order id
      - customer order id
      - order reference
      - osco order id
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    indexed: true
    examples:
      - "234536376"
  versionNumber:
    type: integer
    description: Business order version number. Use this when the user asks for the order version. Do not confuse this with the ignored technical field named version.
    synonyms:
      - order version
      - business version
      - version number
      - versionNumber
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
    examples:
      - 1
  posTransactionNumber:
    type: string
    description: POS transaction number associated with the order.
    synonyms:
      - pos transaction
      - pos transaction number
      - transaction number
      - pos id
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    examples:
      - POS12345
  cartId:
    type: string
    description: Cart identifier associated with the order before checkout. Use this when the user asks for cart id/cart number.
    synonyms:
      - cart id
      - cart number
      - basket id
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    examples:
      - "289735733"

  # Store and fulfillment routing. Use these for store, MFC, fulfillment, company, and active/inactive questions.
  storeNumber:
    type: string
    description: Store number where the order is associated.
    synonyms:
      - store number
      - store id
      - order store
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    examples:
      - "0177"
  fulfillmentStoreNumber:
    type: string
    description: Store number responsible for fulfilling the order.
    synonyms:
      - fulfillment store
      - fulfillment store number
      - picking store
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    examples:
      - "0177"
  fulfillmentSystem:
    type: string
    description: Fulfillment system handling the order. When the user says "bakery order" or "bakery orders", this maps to fulfillmentSystem = ACUMTO.
    synonyms:
      - fulfillment system
      - mfc
      - fulfillment platform
      - bakery
      - bakery order
      - bakery orders
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    examples:
      - ACUMTO
      - APS
      - MFC
  companyId:
    type: string
    description: Company or banner identifier for the order.
    synonyms:
      - company id
      - banner id
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    exact_match: true
    examples:
      - "1"
  banner:
    type: string
    description: Retail banner for the order, such as safeway.
    synonyms:
      - banner
      - retail banner
      - store banner
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
    examples:
      - safeway
  isActive:
    type: boolean
    description: Indicates whether the order record is currently active.
    synonyms:
      - active
      - active order
      - is active
    searchable: true
    filterable: true
    sortable: false
    return_by_default: true
    pii: false
  orderCount:
    type: integer
    description: Count value stored on the order document.
    synonyms:
      - order count
      - count
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
  pickerFirstName:
    type: string
    description: First name of the picker associated with the order. Operational person name; do not return by default.
    synonyms:
      - picker first name
      - picker name
      - picked by
    searchable: true
    filterable: true
    sortable: false
    return_by_default: false
    pii: true
  isRetry:
    type: boolean
    description: Indicates whether the order document is marked for retry/reprocessing.
    synonyms:
      - retry
      - is retry
      - retry order
      - reprocess
