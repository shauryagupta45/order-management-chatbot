  orderCreatedDate:
    type: datetime
    mixed_date_string: true
    description: >-
      Business timestamp when the order was created (UTC). Prefer this over technical createdDate. Stored as a BSON date in some documents and an ISO-8601 string (e.g. "2025-07-03T06:39:58.331Z") in others; the query tools rewrite date filters on this field to match both, so filter with {"$date": "...Z"} bounds as usual. Only
      orders after the handoff (about the last 6 months in prod) are kept here; older orders are in osco.orderHistory. For order
      counts over a date range use the count_orders tool, which picks the collection(s) for you.
    synonyms:
      - order created date
      - created date
      - order date
      - purchase date
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
  orderCancelCutoffDate:
    type: datetime
    mixed_date_string: true
    description: >-
      Latest timestamp by which the customer/order can be cancelled. Stored as a BSON date in some documents and an ISO-8601 string (e.g. "2025-07-03T06:39:58.331Z") in others; the query tools rewrite date filters on this field to match both, so filter with {"$date": "...Z"} bounds as usual.
    synonyms:
      - cancel cutoff
      - cancellation cutoff
      - order cancel cutoff
    searchable: true
    filterable: true
    sortable: true
    return_by_default: true
    pii: false
  orderEditCutoffDate:
    type: datetime
    mixed_date_string: true
    description: >-
      Latest timestamp by which the customer/order can be edited. Stored as a BSON date in some documents and an ISO-8601 string (e.g. "2025-07-03T06:39:58.331Z") in others; the query tools rewrite date filters on this field to match both, so filter with {"$date": "...Z"} bounds as usual.
    synonyms:
