  # Audit, external order, and receipt fields. Use auditLog event names for lifecycle timing questions.
  createdDate:
    type: datetime
    mixed_date_string: true
    description: >-
      Technical timestamp when this document was written. Prefer orderCreatedDate for order creation questions.
      Stored as a BSON date in some documents and an ISO-8601 string (e.g. "2025-07-03T06:39:58.331Z") in others; the query tools rewrite date filters on this field to match both, so filter with {"$date": "...Z"} bounds as usual.
    synonyms:
      - document created date
      - record created date
    filterable: true
    sortable: true
    return_by_default: false
    pii: false
