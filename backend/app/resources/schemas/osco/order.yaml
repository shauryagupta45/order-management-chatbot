sample_queries:
  - user_request: find order 234536376
    target:
      database: osco
      collection: order
      filter:
        orderNumber: "234536376"
  - user_request: show orders for store 0177
    target:
      database: osco
      collection: order
      filter:
        storeNumber: "0177"
  - user_request: find order by fulfillment order number 23453637601
    target:
      database: osco
      collection: order
      filter:
        subOrders.fulfillmentOrderNumber: "23453637601"
  - user_request: show orders for customer id 2345366
    target:
      database: osco
      collection: order
      filter:
        customer.customerId: "2345366"
  - user_request: find orders with exception PRICING_UNAVAILABLE
    target:
      database: osco
      collection: order
      filter:
        subOrders.exceptions.exceptionCode: PRICING_UNAVAILABLE
