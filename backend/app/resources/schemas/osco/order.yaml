    filterable: true
    return_by_default: false
    pii: false
  storeFlags.publishPaymentRequested:
    type: string
    description: Store flag indicating whether payment-request publishing is enabled. Stored as a string in MongoDB.
    synonyms:
      - publish payment requested
      - payment requested publish flag
    searchable: true
