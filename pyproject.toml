[project]
name = "mongodb-domain-mcp"
version = "0.1.0"
description = "Schema-aware read-only MCP server for MongoDB"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "pymongo>=4.7.0",
  "PyYAML>=6.0.1",
  "certifi>=2024.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
